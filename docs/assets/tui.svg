<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a1f"/>
      <stop offset="100%" stop-color="#0a0718"/>
    </linearGradient>
    <linearGradient id="wispBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- marco de terminal -->
  <g filter="url(#termShadow)">
    <rect x="20" y="20" width="860" height="520" rx="14" fill="url(#termBg)" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- barra de título -->
    <rect x="20" y="20" width="860" height="40" rx="14" fill="#171233"/>
    <rect x="20" y="46" width="860" height="14" fill="#171233"/>
    <circle cx="46" cy="40" r="7" fill="#e879f9"/>
    <circle cx="70" cy="40" r="7" fill="#a78bfa"/>
    <circle cx="94" cy="40" r="7" fill="#22d3ee"/>
    <text x="450" y="46" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="14" fill="#8b85a8">reverse-agent — C:\proyectos\mi-app</text>
  </g>

  <!-- contenido -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="15">
    <!-- bienvenida -->
    <text x="48" y="92" fill="#22d3ee" font-weight="700">Welcome to Reverse Agent <tspan fill="#8b85a8" font-weight="400">v2.1.87</tspan></text>
    <text x="48" y="112" fill="#4c4670">──────────────────────────────────────────────────────────</text>
    <text x="48" y="132" fill="#4c4670">      ·        ✦           ·         ✧        ·</text>

    <!-- Wisp en ascii-art (bloques) -->
    <g transform="translate(330,140)">
      <rect x="0" y="0" width="96" height="14" rx="3" fill="url(#wispBody)"/>
      <rect x="-8" y="16" width="112" height="14" rx="3" fill="url(#wispBody)"/>
      <rect x="16" y="18" width="12" height="10" rx="3" fill="#181432"/>
      <rect x="68" y="18" width="12" height="10" rx="3" fill="#181432"/>
      <text x="0" y="46" fill="#8b5cf6" font-size="14">▚▞▚▞▚▞▚▞</text>
    </g>

    <text x="48" y="212" fill="#4c4670">  ✧          ·        ✦          ·          ✧</text>
    <text x="48" y="232" fill="#4c4670">──────────────────────────────────────────────────────────</text>

    <!-- conversación -->
    <text x="48" y="272" fill="#e879f9" font-weight="700">❯ </text>
    <text x="66" y="272" fill="#e0f2fe">agrega un endpoint /health con FastAPI</text>

    <text x="48" y="304" fill="#22d3ee" font-weight="700">✦ Reverse Agent</text>
    <text x="48" y="328" fill="#b8b2d4">Voy a crear el endpoint en app.py.</text>

    <!-- bloque de herramienta -->
    <g transform="translate(48,344)">
      <rect width="804" height="66" rx="8" fill="#141029" stroke="#e879f9" stroke-opacity="0.35"/>
      <text x="16" y="26" fill="#e879f9">✻ Edit(app.py)</text>
      <text x="16" y="50" fill="#4ade80">+ @app.get("/health")</text>
    </g>

    <text x="48" y="440" fill="#22d3ee" font-weight="700">✦ Reverse Agent</text>
    <text x="48" y="464" fill="#b8b2d4">Listo ✓ — endpoint /health creado y probado (200 OK).</text>

    <!-- prompt inferior -->
    <g transform="translate(48,486)">
      <rect width="804" height="34" rx="8" fill="#141029" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="14" y="23" fill="#22d3ee" font-weight="700">❯</text>
      <rect x="32" y="9" width="9" height="17" fill="#22d3ee" opacity="0.9"/>
    </g>
  </g>
</svg>
